server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Service worker do PWA: nunca cachear, senão a atualização não propaga.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: rotas do React Router caem em index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (Vite) podem ser cacheados por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
